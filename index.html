<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <script>
    for (const name of ["gesturestart", "gesturechange", "gestureend"]) {
      document.addEventListener(name, (event) => event.preventDefault());
    }
  </script>
  <title>A.M.D TCG — Pokémon</title>
  <meta name="description" content="Cartas avulsas e lacrados de Pokémon. A.M.D TCG." />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" type="image/png" href="assets/logo-mark.png" />
  <link rel="stylesheet" href="styles.css?v=69" />
</head>
<body>
  <div class="boot" id="boot" role="status" aria-live="polite" aria-label="Carregando">
    <img src="assets/logo-mark.png?v=10" alt="" width="220" height="140" />
    <div class="boot-track"><span></span></div>
  </div>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>

  <header class="top">
    <a class="brand" href="#/" aria-label="A.M.D TCG, início">
      <img src="assets/logo-mark.png?v=10" alt="A.M.D TCG" width="76" height="76" />
    </a>
    <form class="search" id="search-form" role="search">
      <img src="assets/icons/search.png" alt="" width="18" height="18" />
      <label class="sr" for="q">Buscar carta ou número</label>
      <input id="q" name="q" type="search" placeholder="Buscar por nome ou número" autocomplete="off" />
      <label class="sr" for="set-filter-btn">Filtrar coleção</label>
      <div class="set-pick" id="set-filter">
        <button class="set-pick-btn" id="set-filter-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <img alt="" hidden />
          <span>Todas as coleções</span>
        </button>
        <div class="set-pick-list" role="listbox" hidden></div>
      </div>
    </form>
    <div class="top-actions">
      <button class="menu-toggle" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav">
        <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span>Menu</span>
      </button>
      <a class="ghost" id="criar" href="#/cadastro">Criar conta</a>
      <button class="ghost" id="sair" type="button" hidden>Sair</button>
      <a class="solid" id="entrar" href="#/entrar">Entrar</a>
    </div>
  </header>

  <div class="shell">
    <button class="backdrop" id="backdrop" type="button" aria-label="Fechar menu" hidden></button>
    <aside class="menu" id="menu">
      <nav id="nav" aria-label="Menu">
        <a href="#/"><img src="assets/icons/home.png" alt="" />Catálogo</a>
        <a href="#/colecoes"><img src="assets/icons/sets.png" alt="" />Coleções</a>
        <a href="#/contato"><img src="assets/icons/chat.png" alt="" />Contato</a>
        <a href="#/sobre"><img src="assets/icons/search.png" alt="" />Sobre</a>
        <a href="#/cadastro"><img src="assets/icons/buy.png" alt="" />Cadastro</a>
      </nav>
    </aside>

    <div class="content">
      <main id="conteudo"></main>

      <footer class="foot">
        <p>Site desenvolvido por <a class="credit" href="https://felipeseussites.vercel.app" target="_blank" rel="noopener noreferrer">Felipe</a></p>
        <nav class="legal-nav" aria-label="Documentos">
          <a href="#/privacidade">Privacidade</a>
          <a href="#/cookies">Cookies</a>
          <a href="#/termos">Termos de uso</a>
        </nav>
      </footer>
    </div>
  </div>

  <div class="cookie" id="cookie" hidden>
    <p>A conta guarda só o necessário neste aparelho. Se você aceitar, a loja também registra a visita: página, IP e cidade.</p>
    <a href="#/cookies">Ver cookies</a>
    <div class="cookie-actions">
      <button class="ghost" id="cookie-min" type="button">Só o necessário</button>
      <button class="solid" id="cookie-all" type="button">Aceitar</button>
    </div>
  </div>
  <script src="catalog.js?v=10"></script>
  <script src="supabase.js"></script>
  <script src="app.js?v=50"></script>
</body>
</html>
